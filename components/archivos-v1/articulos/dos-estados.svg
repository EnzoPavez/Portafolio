<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="El índice cerrado como rayas y abierto con los títulos">
  <rect width="640" height="260" rx="16" fill="#f3f3f3"/>

  <!-- Texto del artículo, igual en las dos tarjetas -->
  <defs>
    <g id="texto">
      <rect x="188" y="32" width="72" height="7" rx="3.5" fill="#dcdcdc"/>
      <rect x="188" y="52" width="72" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="61" width="66" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="70" width="72" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="79" width="44" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="97" width="72" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="106" width="70" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="115" width="58" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="135" width="40" height="4" rx="2" fill="#dcdcdc"/>
      <rect x="188" y="148" width="72" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="157" width="68" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="166" width="72" height="3" rx="1.5" fill="#ececec"/>
      <rect x="188" y="175" width="36" height="3" rx="1.5" fill="#ececec"/>
    </g>
  </defs>

  <!-- Cerrado -->
  <g transform="translate(24 24)">
    <rect x=".5" y=".5" width="283" height="211" rx="12" fill="#ffffff" stroke="#e8e8e8"/>
    <circle cx="32" cy="34" r="8" fill="#202020"/>
    <rect x="24" y="66" width="14" height="2" rx="1" fill="#d9d9d9"/>
    <rect x="24" y="76" width="14" height="2" rx="1" fill="#d9d9d9"/>
    <rect x="24" y="86" width="26" height="2" rx="1" fill="#202020"/>
    <rect x="24" y="96" width="14" height="2" rx="1" fill="#d9d9d9"/>
    <rect x="24" y="106" width="14" height="2" rx="1" fill="#d9d9d9"/>
    <rect x="24" y="116" width="14" height="2" rx="1" fill="#d9d9d9"/>
    <use href="#texto"/>
  </g>

  <!-- Abierto -->
  <g transform="translate(332 24)">
    <rect x=".5" y=".5" width="283" height="211" rx="12" fill="#ffffff" stroke="#e8e8e8"/>
    <circle cx="32" cy="34" r="8" fill="#202020"/>
    <rect x="14" y="153" width="152" height="22" rx="7" fill="#f3f3f3"/>
    <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#747474">
      <text x="24" y="72">Dos estados</text>
      <text x="24" y="96">Abrir despacio</text>
      <text x="24" y="120" fill="#202020">Una fila tras otra</text>
      <text x="24" y="144">Desenfocar</text>
      <text x="24" y="168" fill="#202020">Saber dónde estás</text>
      <text x="24" y="192">Sin cursor</text>
    </g>
    <path d="M118 158v15l4-3.6 3 6.4 2.4-1.1-3-6.3h5.4z" fill="#202020" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <use href="#texto"/>
  </g>
</svg>
