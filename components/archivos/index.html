  <script>

<body>
  <main class="columna">
    <p class="aviso" id="sin-servidor" hidden>
      Esta página lee los archivos con JavaScript, así que no funciona abriéndola con doble clic.
      Hay que servir la carpeta, por ejemplo con <code>npx serve components/archivos</code>.
    </p>
  </main>
  <script>
    if (location.protocol === "file:") document.getElementById("sin-servidor").hidden = false;
  </script>
  <script type="module">
