<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bolas de papel</title>
  <meta name="description" content="Muestra del componente de bolas de papel sobre la portada." />
  <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Inter:opsz,wght@14..32,400..600&display=swap" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <style>
    /* Muestra de las bolas de papel. Es la portada tal cual, con las bolas encima. */
    :root {
      color-scheme: light dark;
      --fondo: #fcfcfc;
      --fondo-hover: #f6f6f6;
      --trazo: #d9d9d9;
      --foco: #8d8d8d;
      --texto: #202020;
      --texto-suave: #646464;
      --tarjeta: #ffffff;
      --sombra-tarjeta: 0 0 0 1px #0000000f, 0 1px 2px -1px #0000000f, 0 2px 4px 0 #0000000a;
      --letra-chica: 13px;
      --letra-base: 16px;
      --letra-titulo: 30px;
      --fuente-texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --fuente-titulo: "Fraunces", Georgia, "Times New Roman", serif;
      --curva-revelar: cubic-bezier(.16, 1, .3, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0f0f0f;
        --fondo-hover: #1c1c1c;
        --trazo: #3b3b3b;
        --foco: #6e6e6e;
        --texto: #ededed;
        --texto-suave: #b4b4b4;
        --tarjeta: #161616;
        --sombra-tarjeta: 0 0 0 1px #ffffff1a, 0 1px 2px -1px #00000080, 0 2px 4px 0 #0006;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-tap-highlight-color: transparent; }

    a { color: inherit; }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: var(--fuente-texto);
      font-size: var(--letra-base);
      line-height: 1.625;
      font-feature-settings: "cv01";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :focus-visible {
      outline: 2px solid var(--foco);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .columna {
      max-width: 608px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    @media (min-width: 640px) {
      .columna { padding-block: 96px; }
    }

    .entrar {
      animation: entrar .9s var(--curva-revelar) both;
      animation-delay: calc(var(--paso, 0) * 120ms);
    }

    @keyframes entrar {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0);
        filter: blur(4px);
      }
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin: 0 0 96px;
      border-radius: 50%;
      background: var(--texto);
      color: var(--fondo);
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1;
      user-select: none;
    }

    .titulo {
      margin: 0 0 8px;
      font-family: var(--fuente-titulo);
      font-weight: 300;
      font-size: var(--letra-titulo);
      line-height: 1.13;
      letter-spacing: -0.01em;
      font-variation-settings: "SOFT" 60, "opsz" 30;
    }

    .bajada {
      margin: 0 0 48px;
      color: var(--texto-suave);
      text-wrap: balance;
    }

    /* Cada sección del portafolio es un botón grande. Por ahora solo está Archivos. */
    .secciones {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .seccion {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 72px;
      padding: 16px 20px;
      border-radius: 14px;
      background: var(--tarjeta);
      box-shadow: var(--sombra-tarjeta);
      text-decoration: none;
      transition: background-color .2s ease-out, scale .2s ease-out;
    }

    .seccion-texto { flex: 1; min-width: 0; }

    .seccion-nombre {
      display: block;
      font-weight: 550;
      line-height: 1.4;
    }

    .seccion-detalle {
      display: block;
      color: var(--texto-suave);
      font-size: var(--letra-chica);
      line-height: 1.5;
      text-wrap: pretty;
    }

    .seccion svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: var(--texto-suave);
      transition: translate .3s var(--curva-revelar), color .2s ease-out;
    }

    @media (hover: hover) {
      .seccion:hover { background: var(--fondo-hover); }
      .seccion:hover svg { translate: 2px 0; color: var(--texto); }
    }

    .seccion:active { scale: .99; }

    /* Bolas de papel. Cada una se ubica respecto del centro de la página (--x) y de arriba (--y).
       En pantallas angostas quedan contra el borde, medio afuera, como tiradas. */
    .pagina { position: relative; min-height: 100vh; overflow-x: clip; }

    [data-papel] {
      left: clamp(14px, calc(50% + var(--x)), calc(100% - 14px));
      top: var(--y);
    }

    @media (max-width: 899px) {
      [data-papel] { top: var(--y-movil, var(--y)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .entrar { animation: none; }
      .seccion, .seccion svg { transition: none; }
    }
  </style>
</head>
<body>
  <div class="pagina">
  <main class="columna">
    <span class="avatar entrar" aria-hidden="true">EP</span>

    <header class="entrar" style="--paso:1">
      <h1 class="titulo">Enzo Pavez</h1>
      <p class="bajada">Este portafolio se arma de a poco. Por ahora puedes leer mis archivos.</p>
    </header>

    <nav aria-label="Secciones">
      <ul class="secciones">
        <li class="entrar" style="--paso:2">
          <a class="seccion" href="../archivos/">
            <span class="seccion-texto">
              <span class="seccion-nombre">Archivos</span>
              <span class="seccion-detalle">Artículos sobre Delta Lake, Databricks y Fabric</span>
            </span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13.5"/><path d="m13 6.5 5.5 5.5-5.5 5.5"/></svg>
          </a>
        </li>
      </ul>
    </nav>
  </main>

  <span data-papel="diorama-v3" style="--x: -470px; --y: 170px; --y-movil: 450px"></span>
  <span data-papel="nota-comentarios" style="--x: 440px; --y: 300px; --y-movil: 540px"></span>
  <span data-papel="postit-newsletter" style="--x: 150px; --y: 530px; --y-movil: 650px"></span>
  <span data-papel="archivos-v1" style="--x: -400px; --y: 600px; --y-movil: 770px"></span>
  <span data-papel="nota-diorama" style="--x: 430px; --y: 760px; --y-movil: 880px"></span>
  <span data-papel="carta-propuesta" style="--x: -170px; --y: 870px; --y-movil: 990px"></span>
  <span data-papel="boceto-pipeline" style="--x: -480px; --y: 1060px; --y-movil: 1110px"></span>
  <span data-papel="polaroid-bodega" style="--x: 470px; --y: 1080px; --y-movil: 1230px"></span>
  <span data-papel="boceto-portafolio" style="--x: 60px; --y: 1240px; --y-movil: 1350px"></span>
  <span data-papel="foto-rio" style="--x: -380px; --y: 1400px; --y-movil: 1470px"></span>
  </div>

  <script type="module">
    import { montarBolasDePapel } from './bolas-de-papel.js';
    // ?acabado=papel o ?acabado=facetas para comparar. Por defecto va el suave.
    const acabado = new URLSearchParams(location.search).get('acabado') || 'suave';
    montarBolasDePapel({ acabado });
  </script>
</body>
</html>
