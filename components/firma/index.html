<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firma</title>
  <meta name="description" content="Muestra del componente de firma sobre el nombre de la portada." />
  <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Inter:opsz,wght@14..32,400..600&display=swap" />
  <style>
    /* Muestra de la firma. Es la portada tal cual, con la firma sobre el nombre. */
    :root {
      color-scheme: light dark;
      --fondo: #fcfcfc;
      --fondo-hover: #f6f6f6;
      --trazo: #d9d9d9;
      --foco: #8d8d8d;
      --texto: #202020;
      --texto-suave: #646464;
      --tarjeta: #ffffff;
      --sombra-tarjeta: 0 0 0 1px #0000000f, 0 1px 2px -1px #0000000f, 0 2px 4px 0 #0000000a;
      --letra-chica: 13px;
      --letra-base: 16px;
      --letra-titulo: 30px;
      --fuente-texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --fuente-titulo: "Fraunces", Georgia, "Times New Roman", serif;
      --curva-revelar: cubic-bezier(.16, 1, .3, 1);
      --firma: #cf3b38;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0f0f0f;
        --fondo-hover: #1c1c1c;
        --trazo: #3b3b3b;
        --foco: #6e6e6e;
        --texto: #ededed;
        --texto-suave: #b4b4b4;
        --tarjeta: #161616;
        --sombra-tarjeta: 0 0 0 1px #ffffff1a, 0 1px 2px -1px #00000080, 0 2px 4px 0 #0006;
        --firma: #ea5a51;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-tap-highlight-color: transparent; }

    a { color: inherit; }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: var(--fuente-texto);
      font-size: var(--letra-base);
      line-height: 1.625;
      font-feature-settings: "cv01";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :focus-visible {
      outline: 2px solid var(--foco);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .columna {
      max-width: 608px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    @media (min-width: 640px) {
      .columna { padding-block: 96px; }
    }

    .entrar {
      animation: entrar .9s var(--curva-revelar) both;
      animation-delay: calc(var(--paso, 0) * 120ms);
    }

    @keyframes entrar {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0);
        filter: blur(4px);
      }
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      /* En la portada son 96px. Acá hay más aire para que entre la firma encima del nombre. */
      margin: 0 0 150px;
      border-radius: 50%;
      background: var(--texto);
      color: var(--fondo);
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1;
      user-select: none;
    }

    .titulo {
      margin: 0 0 8px;
      font-family: var(--fuente-titulo);
      font-weight: 300;
      font-size: var(--letra-titulo);
      line-height: 1.13;
      letter-spacing: -0.01em;
      font-variation-settings: "SOFT" 60, "opsz" 30;
    }

    .bajada {
      margin: 0 0 48px;
      color: var(--texto-suave);
      text-wrap: balance;
    }

    /* La firma va encima del nombre. Sus minúsculas quedan apoyadas sobre el nombre y los
       trazos largos (el palo de la P, el lazo de la E) bajan cruzando el texto, que queda
       por delante. El ancho define su tamaño. top y translate dejan la línea base de la
       firma (--firma-base, la pone el componente) justo sobre el nombre, a cualquier ancho. */
    .encabezado { position: relative; }
    .encabezado .titulo,
    .encabezado .bajada { position: relative; }

    .firma {
      position: absolute;
      top: -2px;
      left: clamp(-44px, -6%, -8px);
      width: min(500px, calc(100% + 24px));
      translate: 0 calc(var(--firma-base, .6) * -100%);
    }

    /* Cada sección del portafolio es un botón grande. Por ahora solo está Archivos. */
    .secciones {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .seccion {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 72px;
      padding: 16px 20px;
      border-radius: 14px;
      background: var(--tarjeta);
      box-shadow: var(--sombra-tarjeta);
      text-decoration: none;
      transition: background-color .2s ease-out, scale .2s ease-out;
    }

    .seccion-texto { flex: 1; min-width: 0; }

    .seccion-nombre {
      display: block;
      font-weight: 550;
      line-height: 1.4;
    }

    .seccion-detalle {
      display: block;
      color: var(--texto-suave);
      font-size: var(--letra-chica);
      line-height: 1.5;
      text-wrap: pretty;
    }

    .seccion svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: var(--texto-suave);
      transition: translate .3s var(--curva-revelar), color .2s ease-out;
    }

    @media (hover: hover) {
      .seccion:hover { background: var(--fondo-hover); }
      .seccion:hover svg { translate: 2px 0; color: var(--texto); }
    }

    .seccion:active { scale: .99; }

    @media (prefers-reduced-motion: reduce) {
      .entrar { animation: none; }
      .seccion, .seccion svg { transition: none; }
    }
  </style>
</head>
<body>
  <main class="columna">
    <span class="avatar entrar" aria-hidden="true">EP</span>

    <header class="encabezado entrar" style="--paso:1">
      <div class="firma" aria-hidden="true"></div>
      <h1 class="titulo">Enzo Pavez</h1>
      <p class="bajada">Este portafolio se arma de a poco. Por ahora puedes leer mis archivos.</p>
    </header>

    <nav aria-label="Secciones">
      <ul class="secciones">
        <li class="entrar" style="--paso:2">
          <a class="seccion" href="../archivos/">
            <span class="seccion-texto">
              <span class="seccion-nombre">Archivos</span>
              <span class="seccion-detalle">Artículos sobre Delta Lake, Databricks y Fabric</span>
            </span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13.5"/><path d="m13 6.5 5.5 5.5-5.5 5.5"/></svg>
          </a>
        </li>
      </ul>
    </nav>
  </main>

  <script type="module">
    import { montarFirma } from './firma.js';
    // Espera a que el encabezado termine de entrar antes de firmar
    montarFirma(document.querySelector('.firma'), { retraso: 650 });
  </script>
</body>
</html>
